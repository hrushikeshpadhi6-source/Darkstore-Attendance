<!DOCTYPE html>
<html>
<head>
  <title>Darkstore Attendance Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial;
      background:#0b1018;
      color:white;
      padding:20px;
    }
    select, input, button {
      padding:10px;
      margin:5px;
      border-radius:6px;
      border:none;
    }
    button {
      background:#00d4ff;
      cursor:pointer;
      font-weight:bold;
    }
    .locked {
      opacity:0.4;
      pointer-events:none;
    }
    .card {
      background:#141c28;
      padding:15px;
      border-radius:10px;
      margin-bottom:15px;
    }
  </style>
</head>

<body>

<h2>📦 Darkstore Attendance</h2>

<div class="card">
  <h3>Submit Attendance</h3>

  <select id="site">
    <option>Al Raha</option>
    <option>Yas Mall</option>
  </select>

  <input type="number" id="day" placeholder="Day">
  <input type="number" id="month" placeholder="Month">
  <input type="text" id="name" placeholder="Your Name">

  <br>

  <select id="staff"></select>

  <select id="status">
    <option>Present</option>
    <option>Absent</option>
    <option>Week Off</option>
    <option>Sick Leave</option>
  </select>

  <button onclick="submitData()">Submit</button>
</div>

<div class="card">
  <h3>📊 Dashboard</h3>
  <p id="dashboard">Loading...</p>
</div>

<script>

const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";

const STAFF = {
  "Al Raha":["Aaron Ajuna","Mukesh Rajbanshi"],
  "Yas Mall":["Allan Titus","Arnold Owingo"]
};

// Load staff dropdown
function loadStaff() {
  const site = document.getElementById("site").value;
  const staffList = STAFF[site];

  const select = document.getElementById("staff");
  select.innerHTML = "";

  staffList.forEach(name => {
    const option = document.createElement("option");
    option.textContent = name;
    select.appendChild(option);
  });
}

// 🔒 Check locked staff
async function getLocked() {
  const site = document.getElementById("site").value;
  const day = document.getElementById("day").value;
  const month = document.getElementById("month").value;
  const year = new Date().getFullYear();

  const res = await fetch(`${SCRIPT_URL}?action=getMarked&site=${site}&day=${day}&month=${month}&year=${year}`);
  return await res.json();
}

// 📝 Submit
async function submitData() {
  const site = document.getElementById("site").value;
  const day = document.getElementById("day").value;
  const month = document.getElementById("month").value;
  const name = document.getElementById("name").value;
  const staff = document.getElementById("staff").value;
  const status = document.getElementById("status").value;

  if (!day || !month || !name) {
    alert("Fill all fields");
    return;
  }

  const locked = await getLocked();

  if (locked.includes(staff)) {
    alert("❌ Already marked!");
    return;
  }

  const payload = [{
    site,
    day,
    month,
    year: new Date().getFullYear(),
    staff,
    status,
    shift: "A",
    submittedBy: name
  }];

  await fetch(`${SCRIPT_URL}?action=submit&data=${encodeURIComponent(JSON.stringify(payload))}`);

  alert("✅ Saved");
  loadDashboard();
}

// 📊 Dashboard
async function loadDashboard() {
  const res = await fetch(`${SCRIPT_URL}?action=getDashboard`);
  const data = await res.json();

  document.getElementById("dashboard").innerText =
    `Total: ${data.total} | Present: ${data.present} | Absent: ${data.absent}`;
}

// Init
loadStaff();
loadDashboard();

document.getElementById("site").addEventListener("change", loadStaff);

setInterval(loadDashboard, 30000);

</script>

</body>
</html>
