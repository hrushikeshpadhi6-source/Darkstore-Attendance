<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Site Under Maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #070b12, #0f1724);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      max-width: 420px;
      padding: 30px;
      border-radius: 12px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 20px rgba(0,212,255,0.1);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    p {
      font-size: 14px;
      color: #ccc;
      line-height: 1.6;
    }

    .icon {
      font-size: 42px;
      margin-bottom: 15px;
    }

    .countdown {
      margin-top: 20px;
      font-size: 24px;
      font-weight: bold;
      color: #00d4ff;
    }

    .label {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="icon">🚧</div>

    <h1>Site Under Maintenance</h1>

    <p>
      Our system is currently under maintenance.<br><br>
      We are working to improve your experience.<br>
      We will notify you once the service is restored.
    </p>

    <div class="countdown" id="timer">Loading...</div>
    <div class="label">Estimated time remaining</div>
  </div>

<script>

  // ⏳ CHANGE THIS DATE/TIME
  // Format: YYYY-MM-DDTHH:MM:SS
  const endTime = new Date("2026-05-01T18:00:00").getTime();

  function updateTimer() {
    const now = new Date().getTime();
    const distance = endTime - now;

    if (distance <= 0) {
      document.getElementById("timer").innerHTML = "✅ We're Back!";
      return;
    }

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance / (1000 * 60 * 60)) % 24);
    const minutes = Math.floor((distance / (1000 * 60)) % 60);
    const seconds = Math.floor((distance / 1000) % 60);

    document.getElementById("timer").innerHTML =
      `${days}d ${hours}h ${minutes}m ${seconds}s`;
  }

  setInterval(updateTimer, 1000);
  updateTimer();

</script>

</body>
</html>
